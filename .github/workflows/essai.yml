name: Essai de relecture

# La recette de l'essai : elle prend l'outil libre Jetstreamer à un commit fixé, y pose le
# greffon de ce dépôt, compile, relit une plage de slots de l'archive publique Old Faithful
# et rend ce que le greffon a compté. Elle ne se lance qu'à la main, ne lit aucun secret et
# n'écrit rien ailleurs que dans les pièces jointes de l'exécution.

on:
  workflow_dispatch:
    inputs:
      plage:
        description: Plage de slots à relire, « début:fin », bornes comprises
        required: true
      programmes:
        description: Adresses des programmes à garder, en base 58, séparées par des virgules
        required: true
      slots_entiers:
        description: Slots dont les transactions gardées sont écrites en entier, séparés par des virgules (peut rester vide)
        default: ""
      fils:
        description: Nombre de fils de lecture (vide = au choix de l'outil)
        default: ""
      minutes:
        description: Durée au plus de la relecture, en minutes (300 au plus)
        default: "20"
      optimisation:
        description: « rapide » compile vite, « complete » compile comme l'outil le prévoit (plus long, lecture plus vive)
        type: choice
        options: [rapide, complete]
        default: rapide

permissions:
  contents: read

concurrency:
  group: essai
  cancel-in-progress: false

env:
  # anza-xyz/jetstreamer, étiquette jetstreamer@v0.8.1 du 9/10/2026.
  OUTIL: ce2f3678d78ce4a430f63621301b78d914d76a8a
  ARCHIVE: https://files.old-faithful.net
  OPENSSL_NO_VENDOR: "1"

jobs:
  essai:
    name: Relire une plage
    # La machine sur laquelle l'outil est lui-même éprouvé par ses auteurs.
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Atelier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outil, au commit fixé
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anza-xyz/jetstreamer
          ref: ${{ env.OUTIL }}
          path: outil
          persist-credentials: false
      # Rien de ce qui est saisi n'entre dans le texte de ce qui s'exécute : tout passe par
      # l'environnement et est contrôlé avant de servir.
      - name: Saisies
        env:
          PLAGE: ${{ inputs.plage }}
          PROGRAMMES: ${{ inputs.programmes }}
          SLOTS_ENTIERS: ${{ inputs.slots_entiers }}
          FILS: ${{ inputs.fils }}
          MINUTES: ${{ inputs.minutes }}
          OPTIMISATION: ${{ inputs.optimisation }}
        run: |
          refuse() { echo "::error::saisie refusée : $1"; exit 2; }
          [[ "$PLAGE" =~ ^[0-9]{1,12}:[0-9]{1,12}$ ]] || refuse "plage, attendu « début:fin »"
          debut="${PLAGE%%:*}"; fin="${PLAGE##*:}"
          (( 10#$debut <= 10#$fin )) || refuse "plage à l'envers"
          [[ "$PROGRAMMES" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}(,[1-9A-HJ-NP-Za-km-z]{32,44}){0,7}$ ]] \
            || refuse "programmes, attendu des adresses en base 58 séparées par des virgules"
          [[ "$SLOTS_ENTIERS" =~ ^([0-9]{1,12}(,[0-9]{1,12})*)?$ ]] || refuse "slots entiers"
          [[ "$FILS" =~ ^[0-9]{0,3}$ ]] || refuse "fils"
          [[ "$MINUTES" =~ ^[0-9]{1,3}$ ]] && (( 10#$MINUTES >= 1 && 10#$MINUTES <= 300 )) \
            || refuse "minutes, de 1 à 300"
          [[ "$OPTIMISATION" == rapide || "$OPTIMISATION" == complete ]] || refuse "optimisation"
          {
            echo "ESSAI_PLAGE=$((10#$debut)):$((10#$fin))"
            echo "ESSAI_PROGRAMMES=$PROGRAMMES"
            echo "ESSAI_SLOTS_ENTIERS=$SLOTS_ENTIERS"
            echo "ESSAI_FILS=$FILS"
            echo "ESSAI_MINUTES=$((10#$MINUTES))"
            echo "ESSAI_OPTIMISATION=$OPTIMISATION"
            echo "ESSAI_SORTIE=$RUNNER_TEMP/resultat"
            echo "EPOQUE_DEBUT=$((10#$debut / 432000))"
            echo "EPOQUE_FIN=$((10#$fin / 432000))"
          } >> "$GITHUB_ENV"
      - name: Machine
        run: |
          echo "processeurs : $(nproc)" && free -m && df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          rustup --version && cat outil/rust-toolchain.toml
      # Une époque ne paraît dans l'archive qu'une fois finie : la recette le constate avant de
      # compiler, et dit la taille de ce qu'il faudrait lire pour une époque entière.
      - name: Archive
        run: |
          for epoque in $(seq "$EPOQUE_DEBUT" "$EPOQUE_FIN"); do
            for fichier in "epoch-$epoque.car" "epoch-$epoque-slot-ranges.raw"; do
              echo "== $epoque/$fichier"
              curl --silent --show-error --head --location --max-time 60 "$ARCHIVE/$epoque/$fichier" \
                | grep -i -E '^(HTTP/|content-length:|last-modified:)' || echo "pas de réponse"
            done
          done
      - name: Dépendances de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libudev-dev clang llvm-dev libclang-dev pkg-config libssl-dev time zstd
          clang --version | head -1
      - name: Greffon posé dans l'outil
        run: |
          mkdir -p outil/examples/essai
          cp greffon/main.rs greffon/outils.rs outil/examples/essai/
      - name: Compilations déjà faites
        id: deja
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            outil/target
          # Une clé par exécution : chaque exécution repart de la plus récente et garde la sienne.
          key: essai-${{ runner.os }}-${{ env.OUTIL }}-${{ env.ESSAI_OPTIMISATION }}-${{ hashFiles('greffon/*.rs') }}-${{ github.run_id }}
          restore-keys: |
            essai-${{ runner.os }}-${{ env.OUTIL }}-${{ env.ESSAI_OPTIMISATION }}-${{ hashFiles('greffon/*.rs') }}-
            essai-${{ runner.os }}-${{ env.OUTIL }}-${{ env.ESSAI_OPTIMISATION }}-
      # « --locked » : les versions de dépendances que l'outil a lui-même éprouvées, et pas d'autres.
      # Le compilateur déborde de sa pile sur l'une des bibliothèques de Solana et conseille
      # lui-même de l'agrandir (constaté à la première exécution).
      - name: Compilation
        working-directory: outil
        env:
          RUST_MIN_STACK: "134217728"
        run: |
          if [[ "$ESSAI_OPTIMISATION" == rapide ]]; then
            export CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          depart=$SECONDS
          cargo build --release --locked --example essai
          echo "compilation : $((SECONDS - depart)) s"
          ls -l target/release/examples/essai && du -sh target
      # Gardées dès maintenant, même si la compilation s'est arrêtée en route : ni une relecture
      # qui échoue ni une reprise ne doivent coûter ce qui est déjà compilé.
      - name: Compilations gardées
        if: always() && steps.deja.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            outil/target
          key: essai-${{ runner.os }}-${{ env.OUTIL }}-${{ env.ESSAI_OPTIMISATION }}-${{ hashFiles('greffon/*.rs') }}-${{ github.run_id }}
      - name: Relecture
        env:
          JETSTREAMER_CLICKHOUSE_MODE: "off"
        run: |
          mkdir -p "$ESSAI_SORTIE"
          # Octets reçus du réseau, toutes cartes confondues sauf la boucle locale.
          recu() {
            awk 'NR > 2 { sub(/^ +/, ""); split($0, champs, /[: ]+/); if (champs[1] != "lo") octets += champs[2] }
              END { printf "%d\n", octets }' /proc/net/dev
          }
          avant=$(recu); depart=$SECONDS
          # Passé la durée dite, la lecture est arrêtée comme par Ctrl-C, et l'étape échoue avec
          # le code 124 : les comptes rendus sont alors ceux d'une plage lue en partie.
          issue=0
          timeout --signal=INT --kill-after=120 "${ESSAI_MINUTES}m" \
            /usr/bin/time -v outil/target/release/examples/essai || issue=$?
          echo "relecture : code $issue, $((SECONDS - depart)) s, $(( ($(recu) - avant) / 1000000 )) Mo reçus du réseau"
          exit "$issue"
      - name: Résultats
        if: always()
        run: |
          cd "$ESSAI_SORTIE" 2> /dev/null || { echo "aucun résultat"; exit 0; }
          ls -l
          cat resume.json 2> /dev/null || echo "pas de résumé"
          if [[ -s comptes.csv ]]; then
            echo "slots comptés : $(( $(wc -l < comptes.csv) - 1 ))"
            awk -F, 'NR > 1 { gardees += $2; echouees += $3 } END { print "gardées : " gardees ", dont échouées : " echouees }' comptes.csv
          fi
          if [[ -s transactions.jsonl ]]; then
            echo "transactions entières : $(wc -l < transactions.jsonl) ligne(s)"
            zstd --quiet --rm -10 transactions.jsonl
          fi
          ls -l
      - name: Pièce jointe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultat
          path: ${{ runner.temp }}/resultat
          if-no-files-found: warn
          retention-days: 14
