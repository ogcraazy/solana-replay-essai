name: Essai de relecture

# L'épreuve de l'atelier : elle prend l'outil libre Jetstreamer à un commit fixé, y pose le
# greffon de ce dépôt et deux correctifs, compile (scripts du dossier « recette »), relit une
# plage de slots de l'archive publique Old Faithful et rend le flux des transactions des
# programmes donnés, au format Yellowstone gRPC, à un programme d'empreintes qui le lit au fil
# de l'eau : rien du flux n'est gardé, hors ce qui est nommé. Elle ne se lance qu'à la main et
# ne lit aucun secret ; ses résultats, des données publiques de la chaîne, sont déposés sur la
# branche « resultats » de ce dépôt.
#
# Deux modes. « voies » : le programme écrit le flux dans des tubes, plusieurs fils lisant
# chacun sa part de la plage. « service » : le lecteur est installé sur la machine de
# l'exécution comme il le serait sur une machine louée (scripts du dossier « lecteur »), la
# plage lui est adressée comme une vraie demande, par le réseau de la machine même, puis ses
# garde-fous sont contrôlés un à un.

on:
  workflow_dispatch:
    inputs:
      plage:
        description: Plage de slots à relire, « début:fin », bornes comprises
        required: true
      programmes:
        description: Adresses des programmes à garder, en base 58, séparées par des virgules
        required: true
      mode:
        description: « voies », le flux part dans des tubes ; « service », le lecteur est installé et reçoit la plage comme une demande
        type: choice
        options: [voies, service]
        default: voies
      a_part:
        description: Mode « voies » - transactions dont l'enregistrement est gardé, « slot/rang » séparés par des virgules (peut rester vide)
        default: ""
      garder_flux:
        description: Mode « service » - garder le flux reçu avec les résultats (plage de 20 slots au plus)
        type: choice
        options: [non, oui]
        default: non
      voies:
        description: Mode « voies » - nombre de voies du flux, chacune lue par un programme d'empreintes (1 à 8)
        default: "3"
      echantillon:
        description: Une tranche de slots sur N porte le détail champ par champ
        default: "16"
      fils:
        description: Nombre de fils de lecture (vide = au choix de l'outil)
        default: ""
      ordre:
        description: Mode « voies » - « parallele », plusieurs fils lisent chacun sa part de la plage ; « sequentiel », un seul fil la rend dans l'ordre de la chaîne
        type: choice
        options: [parallele, sequentiel]
        default: parallele
      minutes:
        description: Durée au plus de la relecture, en minutes (300 au plus)
        default: "20"
      optimisation:
        description: « rapide » compile vite, « complete » compile comme l'outil le prévoit (plus long, lecture plus vive)
        type: choice
        options: [rapide, complete]
        default: rapide

permissions:
  contents: read

concurrency:
  group: essai
  cancel-in-progress: false

env:
  # anza-xyz/jetstreamer, étiquette jetstreamer@v0.8.1 du 9/10/2026.
  OUTIL: ce2f3678d78ce4a430f63621301b78d914d76a8a
  ARCHIVE: https://files.old-faithful.net
  OPENSSL_NO_VENDOR: "1"
  # Limite d'octets sous laquelle un nœud garde les journaux d'une transaction : l'archive
  # les a entiers, le programme d'empreintes les coupe par la règle du nœud avant de les lire.
  COUPE: "10000"

jobs:
  essai:
    name: Relire une plage
    # La machine sur laquelle l'outil est lui-même éprouvé par ses auteurs.
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Atelier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outil, au commit fixé
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anza-xyz/jetstreamer
          ref: ${{ env.OUTIL }}
          path: outil
          persist-credentials: false
      # Rien de ce qui est saisi n'entre dans le texte de ce qui s'exécute : tout passe par
      # l'environnement et est contrôlé avant de servir.
      - name: Saisies
        env:
          PLAGE: ${{ inputs.plage }}
          PROGRAMMES: ${{ inputs.programmes }}
          MODE: ${{ inputs.mode }}
          A_PART: ${{ inputs.a_part }}
          GARDER_FLUX: ${{ inputs.garder_flux }}
          VOIES: ${{ inputs.voies }}
          ECHANTILLON: ${{ inputs.echantillon }}
          FILS: ${{ inputs.fils }}
          ORDRE: ${{ inputs.ordre }}
          MINUTES: ${{ inputs.minutes }}
          OPTIMISATION: ${{ inputs.optimisation }}
        run: |
          refuse() { echo "::error::saisie refusée : $1"; exit 2; }
          [[ "$PLAGE" =~ ^[0-9]{1,12}:[0-9]{1,12}$ ]] || refuse "plage, attendu « début:fin »"
          debut="${PLAGE%%:*}"; fin="${PLAGE##*:}"
          (( 10#$debut <= 10#$fin )) || refuse "plage à l'envers"
          [[ "$PROGRAMMES" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}(,[1-9A-HJ-NP-Za-km-z]{32,44}){0,7}$ ]] \
            || refuse "programmes, attendu des adresses en base 58 séparées par des virgules"
          [[ "$A_PART" =~ ^([0-9]{1,12}/[0-9]{1,6}(,[0-9]{1,12}/[0-9]{1,6})*)?$ ]] \
            || refuse "transactions à part, attendu « slot/rang » séparés par des virgules"
          [[ "$VOIES" =~ ^[1-8]$ ]] || refuse "voies, de 1 à 8"
          if ! [[ "$ECHANTILLON" =~ ^[0-9]{1,9}$ ]] || (( 10#$ECHANTILLON < 1 )); then
            refuse "échantillon, un nombre au moins égal à 1"
          fi
          [[ "$FILS" =~ ^[0-9]{0,3}$ ]] || refuse "fils"
          [[ "$ORDRE" == parallele || "$ORDRE" == sequentiel ]] || refuse "ordre"
          if ! [[ "$MINUTES" =~ ^[0-9]{1,3}$ ]] || (( 10#$MINUTES < 1 || 10#$MINUTES > 300 )); then
            refuse "minutes, de 1 à 300"
          fi
          [[ "$OPTIMISATION" == rapide || "$OPTIMISATION" == complete ]] || refuse "optimisation"
          [[ "$MODE" == voies || "$MODE" == service ]] || refuse "mode"
          [[ "$GARDER_FLUX" == non || "$GARDER_FLUX" == oui ]] || refuse "garder le flux, « oui » ou « non »"
          slots=$(( 10#$fin - 10#$debut + 1 ))
          if [[ "$MODE" == service ]]; then
            # Ce que le lecteur refuserait de toute façon, dit avant de compiler.
            (( slots <= 432000 )) || refuse "mode « service » : une plage de 432 000 slots au plus"
            [[ -z "$A_PART" ]] || refuse "mode « service » : pas de transactions à part"
          fi
          if [[ "$GARDER_FLUX" == oui ]]; then
            [[ "$MODE" == service ]] || refuse "garder le flux : en mode « service » seulement"
            # Un slot pèse environ un million et demi d'octets de flux.
            (( slots <= 20 )) || refuse "garder le flux : pour une plage de 20 slots au plus"
          fi
          {
            echo "ESSAI_MODE=$MODE"
            echo "ESSAI_GARDER_FLUX=$GARDER_FLUX"
            echo "ESSAI_PLAGE=$((10#$debut)):$((10#$fin))"
            echo "ESSAI_PROGRAMMES=$PROGRAMMES"
            echo "ESSAI_A_PART=$A_PART"
            echo "ESSAI_NOMBRE_DE_VOIES=$VOIES"
            echo "ESSAI_ECHANTILLON=$((10#$ECHANTILLON))"
            echo "ESSAI_TRANCHE=100"
            echo "ESSAI_FILS=$FILS"
            echo "ESSAI_ORDRE=$ORDRE"
            echo "ESSAI_MINUTES=$((10#$MINUTES))"
            echo "ESSAI_OPTIMISATION=$OPTIMISATION"
            echo "ESSAI_SORTIE=$RUNNER_TEMP/resultat"
            echo "EPOQUE_DEBUT=$((10#$debut / 432000))"
            echo "EPOQUE_FIN=$((10#$fin / 432000))"
          } >> "$GITHUB_ENV"
      - name: Machine
        run: |
          echo "processeurs : $(nproc)" && free -m && df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          rustup --version && cat outil/rust-toolchain.toml
      # Une époque ne paraît dans l'archive qu'une fois finie : la recette le constate avant de
      # compiler, et dit la taille de ce qu'il faudrait lire pour une époque entière.
      - name: Archive
        run: |
          for epoque in $(seq "$EPOQUE_DEBUT" "$EPOQUE_FIN"); do
            for fichier in "epoch-$epoque.car" "epoch-$epoque-slot-ranges.raw"; do
              echo "== $epoque/$fichier"
              curl --silent --show-error --head --location --max-time 60 "$ARCHIVE/$epoque/$fichier" \
                | grep -i -E '^(HTTP/|content-length:|last-modified:)' || echo "pas de réponse"
            done
          done
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Le programme d'empreintes et les définitions du flux sont contrôlés par leurs
      # empreintes ; les bibliothèques, par les leurs ; le module des définitions est produit
      # ici, à chaque exécution.
      - name: Programme d'empreintes et définitions du flux
        run: |
          (cd empreintes && sha256sum --check EMPREINTES.sha256)
          python -m pip install --quiet --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r empreintes/dependances.txt
          modeles=$(python -c 'import grpc_tools, pathlib; print(pathlib.Path(grpc_tools.__file__).parent / "_proto")')
          mkdir -p "$RUNNER_TEMP/definitions"
          for definition in solana-storage.proto geyser.proto; do
            python -m grpc_tools.protoc -Iempreintes/definitions "-I$modeles" \
              "--python_out=$RUNNER_TEMP/definitions" "$definition"
          done
          ls -l "$RUNNER_TEMP/definitions"
          python --version
          python -c 'import google.protobuf; print("protobuf", google.protobuf.__version__)'
      # Les scripts de la recette et du lecteur : leur syntaxe, et ce qu'un relecteur automatique
      # y trouverait à redire.
      - name: Scripts
        run: |
          for script in recette/*.sh lecteur/*.sh lecteur/servir; do
            bash -n "$script"
          done
          shellcheck recette/*.sh lecteur/*.sh lecteur/servir
          [[ "$(< recette/OUTIL)" == "$OUTIL" ]] || { echo "::error::recette/OUTIL ne dit pas le commit de l'outil pris ici"; exit 1; }
      - name: Dépendances de compilation
        run: sudo bash recette/dependances.sh
      - name: Compilations déjà faites
        id: deja
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            outil/target
          # Une clé par exécution : chaque exécution repart de la plus récente et garde la sienne.
          key: essai-${{ runner.os }}-${{ env.OUTIL }}-${{ env.ESSAI_OPTIMISATION }}-${{ hashFiles('greffon/*') }}-${{ github.run_id }}
          restore-keys: |
            essai-${{ runner.os }}-${{ env.OUTIL }}-${{ env.ESSAI_OPTIMISATION }}-${{ hashFiles('greffon/*') }}-
            essai-${{ runner.os }}-${{ env.OUTIL }}-${{ env.ESSAI_OPTIMISATION }}-
      # Les essais des modules du greffon, les deux correctifs, le greffon posé dans l'outil et
      # la compilation : le même script que sur une machine louée. Le programme porte le commit
      # de cet atelier et celui de l'outil, qu'il redit en tête de chaque flux.
      - name: Construction
        run: bash recette/construire.sh outil "$ESSAI_OPTIMISATION"
      # Gardées dès maintenant, même si la compilation s'est arrêtée en route : ni une relecture
      # qui échoue ni une reprise ne doivent coûter ce qui est déjà compilé.
      - name: Compilations gardées
        if: always() && steps.deja.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            outil/target
          key: essai-${{ runner.os }}-${{ env.OUTIL }}-${{ env.ESSAI_OPTIMISATION }}-${{ hashFiles('greffon/*') }}-${{ github.run_id }}
      # Le greffon écrit le flux dans des tubes ; un programme d'empreintes lit chacun au fil
      # de l'eau, dans un interprète qui ignore tout de son entourage (« -I »).
      - name: Relecture
        if: env.ESSAI_MODE == 'voies'
        env:
          JETSTREAMER_CLICKHOUSE_MODE: "off"
        run: |
          mkdir -p "$ESSAI_SORTIE" "$RUNNER_TEMP/voies"
          tubes=(); lecteurs=(); dossiers=()
          for (( voie = 0; voie < ESSAI_NOMBRE_DE_VOIES; voie++ )); do
            tube="$RUNNER_TEMP/voies/tube-$voie"
            mkfifo "$tube"
            tubes+=("$tube"); dossiers+=("$RUNNER_TEMP/voies/empreintes-$voie")
            python -I empreintes/empreintes.py --definitions "$RUNNER_TEMP/definitions" \
              --plage "$ESSAI_PLAGE" --coupe "$COUPE" --tranche "$ESSAI_TRANCHE" \
              --echantillon "$ESSAI_ECHANTILLON" --sortie "$RUNNER_TEMP/voies/empreintes-$voie" \
              < "$tube" > "$RUNNER_TEMP/voies/resume-$voie.json" 2> "$ESSAI_SORTIE/journal-voie-$voie.txt" &
            lecteurs+=($!)
          done
          ESSAI_VOIES=$(IFS=,; echo "${tubes[*]}")
          export ESSAI_VOIES
          # Octets reçus par la carte qui porte la route par défaut, et elle seule : la machine
          # montre la même réception sous deux cartes (la carte et sa doublure), et les
          # additionner comptait double (constaté à l'exécution n° 44329878008).
          carte=$(ip -o route get 1.1.1.1 2> /dev/null | sed -n 's/.* dev \([^ ]*\).*/\1/p' || true)
          echo "carte de la route par défaut : ${carte:-aucune}"
          recu() { cat "/sys/class/net/${carte:-eth0}/statistics/rx_bytes" 2> /dev/null || echo 0; }
          avant=$(recu); depart=$SECONDS
          # Passé la durée dite, la lecture est arrêtée comme par Ctrl-C, et l'étape échoue avec
          # le code 124 : les empreintes rendues sont alors celles d'une plage lue en partie.
          issue=0
          timeout --signal=INT --kill-after=120 "${ESSAI_MINUTES}m" \
            /usr/bin/time -v outil/target/release/examples/essai || issue=$?
          echo "relecture : code $issue, $((SECONDS - depart)) s, $(( ($(recu) - avant) / 1000000 )) Mo reçus du réseau"
          # Un lecteur dont le tube n'a jamais été ouvert en écriture attend encore : l'ouvrir
          # et le refermer le libère. Quand le lecteur a déjà fini, l'ouverture ne répond pas et
          # s'arrête d'elle-même.
          for tube in "${tubes[@]}"; do
            # shellcheck disable=SC2016
            timeout 5 bash -c ': > "$0"' "$tube" || true
          done
          lectures=0
          for voie in "${!lecteurs[@]}"; do
            code=0; wait "${lecteurs[$voie]}" || code=$?
            echo "voie $voie : programme d'empreintes, code $code"
            (( code == 0 )) || lectures=1
          done
          echo "empreintes : $((SECONDS - depart)) s depuis le début de la relecture"
          fusion=0
          python -I empreintes/empreintes.py --fusionner "${dossiers[@]}" \
            --sortie "$RUNNER_TEMP/voies/fusion" > /dev/null || fusion=$?
          echo "fusion des voies : code $fusion"
          if [[ -s "$RUNNER_TEMP/voies/fusion/resume.json" ]]; then
            cp "$RUNNER_TEMP/voies/fusion/resume.json" "$ESSAI_SORTIE/empreintes.json"
            cp "$RUNNER_TEMP/voies/fusion/tranches.csv" "$RUNNER_TEMP/voies/fusion/slots.csv" "$ESSAI_SORTIE/"
          fi
          (( issue == 0 )) || exit "$issue"
          (( lectures == 0 && fusion == 0 )) || exit 1
      # En mode « service », le lecteur est installé sur cette machine comme il le serait sur
      # une machine louée : le système écoute un port de la machine même, et lance le programme
      # à chaque connexion, sous un utilisateur passager.
      - name: Lecteur installé
        if: env.ESSAI_MODE == 'service'
        run: |
          systemctl --version | head -1
          sudo bash lecteur/installer.sh "$PWD/outil/target/release/examples/essai" 127.0.0.1 7411 2
          sudo systemd-analyze verify lecteur.socket 'lecteur@0.service' || true
          systemctl --no-pager --full status lecteur.socket || true
      # D'où partir : le dernier slot à bloc d'avant la plage, lu dans l'index de l'archive —
      # celui de l'époque de la plage, ou de la précédente quand la plage ouvre son époque.
      - name: Départ de la lecture
        if: env.ESSAI_MODE == 'service'
        run: |
          debut="${ESSAI_PLAGE%%:*}"
          epoque=$((debut / 432000))
          prendre() {
            curl --silent --show-error --fail --location --max-time 120 \
              --output "$RUNNER_TEMP/index-$1.raw" "$ARCHIVE/$1/epoch-$1-slot-ranges.raw"
            echo "index de l'époque $1 : $(sha256sum < "$RUNNER_TEMP/index-$1.raw" | cut -d' ' -f1)"
          }
          prendre "$epoque"
          depart=$(python releve/octets.py "$RUNNER_TEMP/index-$epoque.raw" "$epoque" avant "$debut")
          if [[ "$depart" == - ]]; then
            prendre "$((epoque - 1))"
            depart=$(python releve/octets.py "$RUNNER_TEMP/index-$((epoque - 1)).raw" \
              "$((epoque - 1))" avant "$((epoque * 432000))")
          fi
          [[ "$depart" =~ ^[0-9]+$ ]] \
            || { echo "::error::aucun bloc avant la plage, ni dans son époque ni dans la précédente"; exit 1; }
          echo "départ de la lecture : slot $depart, $((debut - depart)) slot(s) avant la plage"
          echo "DEPART=$depart" >> "$GITHUB_ENV"
      # La demande, telle qu'un client la ferait : une ligne, puis le flux jusqu'à ce que le
      # lecteur ferme la connexion. Le flux passe au programme d'empreintes au fil de l'eau.
      - name: Demande
        if: env.ESSAI_MODE == 'service'
        run: |
          mkdir -p "$ESSAI_SORTIE" "$RUNNER_TEMP/voies"
          garde=/dev/null
          if [[ "$ESSAI_GARDER_FLUX" == oui ]]; then
            garde="$ESSAI_SORTIE/demande.flux"
          fi
          carte=$(ip -o route get 1.1.1.1 2> /dev/null | sed -n 's/.* dev \([^ ]*\).*/\1/p' || true)
          recu() { cat "/sys/class/net/${carte:-eth0}/statistics/rx_bytes" 2> /dev/null || echo 0; }
          avant=$(recu); depart=$SECONDS
          # Passé la durée dite, le client s'en va : le lecteur s'arrête de lui-même, et les
          # empreintes rendues sont alors celles d'une plage lue en partie.
          set +e
          timeout --signal=TERM --kill-after=30 "${ESSAI_MINUTES}m" \
            bash lecteur/demander.sh 127.0.0.1 7411 "v1 $ESSAI_PLAGE $DEPART $ESSAI_PROGRAMMES" \
            | tee "$garde" \
            | python -I empreintes/empreintes.py --definitions "$RUNNER_TEMP/definitions" \
              --plage "$ESSAI_PLAGE" --coupe "$COUPE" --tranche "$ESSAI_TRANCHE" \
              --echantillon "$ESSAI_ECHANTILLON" --sortie "$RUNNER_TEMP/voies/empreintes-0" \
              > "$RUNNER_TEMP/voies/resume-0.json" 2> "$ESSAI_SORTIE/journal-voie-0.txt"
          codes=("${PIPESTATUS[@]}")
          set -e
          echo "demande : code ${codes[0]} ; programme d'empreintes : code ${codes[2]}"
          echo "lecture : $((SECONDS - depart)) s, $(( ($(recu) - avant) / 1000000 )) Mo reçus du réseau"
          fusion=0
          python -I empreintes/empreintes.py --fusionner "$RUNNER_TEMP/voies/empreintes-0" \
            --sortie "$RUNNER_TEMP/voies/fusion" > /dev/null || fusion=$?
          echo "résumé des empreintes : code $fusion"
          if [[ -s "$RUNNER_TEMP/voies/fusion/resume.json" ]]; then
            cp "$RUNNER_TEMP/voies/fusion/resume.json" "$ESSAI_SORTIE/empreintes.json"
            cp "$RUNNER_TEMP/voies/fusion/tranches.csv" "$RUNNER_TEMP/voies/fusion/slots.csv" "$ESSAI_SORTIE/"
          fi
          (( codes[0] == 0 )) || exit "${codes[0]}"
          (( codes[2] == 0 && fusion == 0 )) || exit 1
      # Les garde-fous du lecteur, un à un : une demande refusée, une ligne trop longue, une
      # ligne qui ne vient pas, un client qui s'en va ; puis, le lecteur réinstallé pour une
      # seule demande à la fois, une connexion de trop.
      - name: Contrôles du lecteur
        if: env.ESSAI_MODE == 'service'
        run: |
          echecs=0
          bash lecteur/controles.sh 127.0.0.1 7411 /usr/local/lib/lecteur/essai \
            "v1 $ESSAI_PLAGE $DEPART $ESSAI_PROGRAMMES" || echecs=$((echecs + $?))
          sudo bash lecteur/installer.sh "$PWD/outil/target/release/examples/essai" 127.0.0.1 7411 1
          bash lecteur/controles.sh 127.0.0.1 7411 /usr/local/lib/lecteur/essai borne \
            || echecs=$((echecs + $?))
          echo "contrôles en échec : $echecs"
          (( echecs == 0 ))
      - name: Journal du lecteur
        if: always() && env.ESSAI_MODE == 'service'
        run: |
          mkdir -p "$ESSAI_SORTIE"
          sudo journalctl --no-pager --output=short-iso -u lecteur.socket -u 'lecteur@*' \
            > "$ESSAI_SORTIE/journal-lecteur.txt" || true
          echo "lignes du journal : $(wc -l < "$ESSAI_SORTIE/journal-lecteur.txt")"
          # Ce que le système et le lanceur ont dit, sans le détail de l'outil.
          grep -E 'systemd\[|servir : |essai : ' "$ESSAI_SORTIE/journal-lecteur.txt" | tail -n 80 || true
      - name: Résultats
        if: always()
        run: |
          cd "$ESSAI_SORTIE" 2> /dev/null || { echo "aucun résultat"; exit 0; }
          find . -maxdepth 1 -name 'journal-voie-*.txt' -size 0 -delete
          tail -n 20 journal-voie-*.txt 2> /dev/null || true
          cat resume.json 2> /dev/null || echo "pas de résumé du greffon"
          cat empreintes.json 2> /dev/null || echo "pas d'empreintes"
          [[ -s a_part.flux ]] && zstd --quiet --rm -19 a_part.flux
          [[ -e a_part.flux ]] && rm a_part.flux
          [[ -s demande.flux ]] && zstd --quiet --rm -19 demande.flux
          [[ -e demande.flux ]] && rm demande.flux
          [[ -s journal-lecteur.txt ]] && zstd --quiet --rm -19 journal-lecteur.txt
          [[ -s slots.csv ]] && zstd --quiet --rm -19 slots.csv
          [[ -s tranches.csv ]] && zstd --quiet --rm -19 tranches.csv
          ls -l
      - name: Pièce jointe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultat
          path: ${{ runner.temp }}/resultat
          if-no-files-found: warn
          retention-days: 14

  # Les résultats sont des données publiques de la chaîne. Cette tâche les dépose sur la
  # branche « resultats » du dépôt ; elle seule a le droit d'y écrire, et elle n'exécute aucun
  # code venu d'ailleurs.
  rendre:
    name: Déposer les résultats
    needs: essai
    if: always() && needs.essai.result != 'cancelled' && needs.essai.result != 'skipped'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Résultats de la relecture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resultat
          path: ${{ runner.temp }}/resultat
      - name: Branche des résultats
        env:
          EXECUTION: ${{ github.run_id }}
        run: |
          if git fetch --quiet --depth 1 origin resultats; then
            git checkout --quiet -B resultats FETCH_HEAD
          else
            git checkout --quiet --orphan resultats
            git rm -r --quiet --force .
          fi
          mkdir -p "executions/$EXECUTION"
          cp "$RUNNER_TEMP"/resultat/* "executions/$EXECUTION/"
          git add executions
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Résultats de l'exécution $EXECUTION"
          git push --quiet origin resultats
          ls -l "executions/$EXECUTION"
